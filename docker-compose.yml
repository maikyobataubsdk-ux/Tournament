version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./releases:/app/releases
      - ./uploads:/app/uploads
      - ./assets:/app/assets:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/app/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-Booyahesports.in}/api/v1
    expose:
      - "3000"

  reverse-proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./releases:/app/releases:ro
      - ./assets:/app/assets:ro
    depends_on:
      - backend
      - web
